<!-- ARDENT mission patch. Original artwork: ring, Mars disc, one transfer arc, wordmark.
     Drawn as simple filled/stroked shapes so it reads as a silhouette when particles form it.
     The <text> is rasterised with the page's Inter Tight by targets.ts (SVG images can't load web fonts). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#fff">
  <circle cx="100" cy="100" r="93" stroke-width="5" />
  <circle cx="100" cy="100" r="83" stroke-width="1.6" />
  <circle cx="132" cy="134" r="27" fill="#fff" stroke="none" />
  <circle cx="44" cy="150" r="5.5" fill="#fff" stroke="none" />
  <path d="M 44 150 C 52 116, 78 100, 112 111" stroke-width="3.2" stroke-linecap="round" />
  <text x="100" y="78" text-anchor="middle" font-size="31" font-weight="600" letter-spacing="3.6" fill="#fff" stroke="none">ARDENT</text>
</svg>
